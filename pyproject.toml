[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skycolor"
version = "0.1.0"
description = "Physically based spectral simulation of sky colour: Rayleigh/Mie scattering, ozone absorption, twilight and inhomogeneous atmospheres."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "Pillow>=10"]
dev = ["pytest>=7"]

[project.scripts]
skycolor = "skycolor.cli:main"

[tool.setuptools.packages.find]
include = ["skycolor*"]

[tool.setuptools.package-data]
skycolor = ["data/*.csv", "data/*.md"]
