[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skycolor"
version = "0.1.0"
description = "Physically based spectral simulation of sky colour: Rayleigh/Mie scattering, ozone absorption, twilight, refraction and inhomogeneous atmospheres."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.11,<2",
    "pillow>=10,<13",
]

[project.scripts]
skycolor = "skycolor.cli:main"

# Installed by default with `uv sync`.  The figures need matplotlib; the tests
# need pytest.  Neither is needed to *run* the model.
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "matplotlib>=3.8,<4",
    "netCDF4>=1.6,<2", # only needed by tools/build_data.py
    "pytest-xdist>=3.6,<4",
]

[tool.pytest.ini_options]
# The version-controlled test suite lives in tests/.  Without an explicit
# testpath, pytest also collects scratchpad/ experiment snapshots whose
# duplicate module basenames collide and abort collection with exit code 2
# (65 collection errors on 2026-11-08; see validation/FAST_SUITE.md).
testpaths = ["tests"]
# Two-tier suite (task-suite-tier).  Default entry point = fast dev-loop
# tier: tests marked ``slow`` are deselected at collection (tests/conftest.py,
# switchable via SKYCOLOR_FULL_SUITE=1); the full acceptance tier is the
# explicit `SKYCOLOR_FULL_SUITE=1 uv run pytest -q -n 12 --dist=loadgroup`.
# The 12-worker xdist form below was measured against serial for the fast
# population and won (median 50.5 s vs 97.0 s over three samples each,
# 2026-11-11); serial `-n 0` remains the equivalence-diagnostic form.
addopts = "-n 12 --dist=loadgroup"
markers = [
    "slow: full-tier-only test — MC statistical convergence, large-grid / full-dome integration, golden-fixture verification, or measured cost above the 2 s fast-tier budget (kind:/cost: reason required, see docs/DEVELOPMENT.md 'Test tiers'); deselected from the default fast tier, runs under SKYCOLOR_FULL_SUITE=1 or an explicit -m/-k/nodeid selection",
]

[tool.setuptools.packages.find]
include = ["skycolor*"]

[tool.setuptools.package-data]
skycolor = ["data/*.csv", "data/*.md"]

[tool.uv]
# The lock file is committed, so the exact versions (including transitive
# dependencies) are reproducible.  Refresh deliberately with `uv lock --upgrade`
# and re-run the validation suite afterwards.
default-groups = ["dev"]
